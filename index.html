<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Bryan Sacueza | Portfolio</title>
    <meta name="description" content="Full-Stack Developer - building pixel-perfect worlds, one commit at a time" />
    <!-- This is the pixel era of the portfolio: a project you can open, not the
         page that should answer a search for the name. It used to defer to v2
         with a canonical, and Bing showed this URL anyway, because a canonical
         is a hint and a matching title is not. So the instruction is now the
         direct one: stay out of the index. A page cannot ask to be left out and
         hand its signals to another page at the same time, so the canonical is
         gone and the noscript summary below carries the link to v2 instead. -->
    <meta name="robots" content="noindex, follow" />
    <meta property="og:url" content="https://houtaroudes-game-portfolio.vercel.app/" />
    <meta property="og:title" content="Bryan Sacueza | Portfolio" />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2313233F'/><text x='16' y='22' font-size='16' font-weight='700' font-family='system-ui' text-anchor='middle' fill='white'>B</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  </head>

  </body>
